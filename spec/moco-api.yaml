components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "There's two ways to authenticate against MOCO:\n\n1. **User API key**. Can be found under the \"Integrations\" tab on the profile page.\n2. **Account API key**. Has to be created in Settings > Extensions > API & Webhooks, with either read-only or full access on all endpoints.\n\nBoth kinds of keys are provided as an Authorization header.\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects.json' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThis key can also be requested via API for user-specific keys:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"email\": \"max@muster.de\",\n    \"password\": \"secret\"\n  }'\n```\n\nIt's also possible to verify if the API key is still valid:\n\n```bash\ncurl https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json'\n```\n\nIf the key is valid, the response code id `200 ok` and the body is:\n\n```json\n{\n  \"id\": 123,\n  \"uuid\": \"aec324a2-4832-11eb-b378-0242ac130002\"\n}\n```\n\notherwise the response code is `401 unauthorized`.\nThere are a few tools to try out the MOCO API. All the examples in this documentation use `curl` to demonstrate the API endpoint.\nA popular graphical UI for REST is [Postman](https://www.postman.com/). Here's an example request for the projects list including the authentication:\n\n![Postman example request](moco-api-postman.png \"Postman example request\")"
  parameters:
    Page:
      name: page
      in: query
      description: Pagination support as described in the general documentation.
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Number of items per page for paginated responses.
      schema:
        type: integer
        minimum: 1
    SortBy:
      name: sort_by
      in: query
      description: Sorting is controlled by the `sort_by` query parameter. Provide the field name and optional order (asc or desc).
      schema:
        type: string
    Ids:
      name: ids
      in: query
      description: "Usage: `GET /api/v1/entities?ids=123,456`\n\nAllows you to filter by comma-separated IDs and fetch multiple entities."
      schema:
        type: string
    UpdatedAfter:
      name: updated_after
      in: query
      description: "Usage: `GET /api/v1/entities?updated_after=2022-04-20T09:17:58Z` (ISO8601 timestamp)\n\nEnables you to give a timestamp for all entities that are created or updated after this timestamp, especially useful for synchronisation purposes.\n\nCombine it with a [webhook subscription](webhooks) on DELETE for the entity to have a complete synchronisation."
      schema:
        type: string
        format: "date-time"
    CustomProperties:
      name: custom_properties
      in: query
      description: "Allows you to filter entities by one or more custom fields. The filter for the custom fields is passed via the query-parameter `custom_properties`. To query entities that contain the value \"Automotive\" in a custom field named \"Sector\", the query would need to be as follows:\n\n`GET /api/v1/entities?custom_properties[Sector]=Automotive`\n\nFiltering by an unknown custom field will result in an empty result set!"
      schema:
        type: object
        additionalProperties: true
      style: deepObject
      explode: true
  schemas:
    ErrorResponse:
      type: object
      description: Generic error response body.
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    CatalogServices:
      type: object
      description: "Item attributes:\n\n- **type** `title` / `description` / `item` / `page-break` / `subtotal` / `separator` - position type\n- **description** (`description` type only)\n- **quantity** can be 0 for all-inclusive item (detailed `item` type only)\n- **unit** only used for detailed `item` type, could be e.g. \"hours\" or \"pieces\", (detailed `item` type only)\n- **unit_price** price for a single unit (detailed `item` type only)\n- **net_total** total price for this position (`item` type only)\n- **unit_cost** internal cost for 1 unit (`item` type only)\n- **optional** optional position (`item` type only)\n- **part** `subtotal` type only, part \"true\" means subtotal to the upper `title`, \"false\" means for the whole document\n- **additional** mark as additional service\n\n```json\n{\n  \"id\": 20370,\n  \"title\": \"Catalog entry\",\n  \"items\": [\n    {\n      \"id\": 113400,\n      \"type\": \"item\",\n      \"title\": \"Setup\",\n      \"description\": null,\n      \"quantity\": 0.0,\n      \"unit\": null,\n      \"unit_price\": 0.0,\n      \"net_total\": 1200.0,\n      \"unit_cost\": 0.0,\n      \"optional\": false,\n      \"part\": false,\n      \"additional\": false,\n      \"revenue_category\": {\n        \"id\": 124,\n        \"name\": \"Hosting\",\n        \"revenue_account\": 30056,\n        \"cost_category\": \"HO1\"\n      },\n      \"created_at\": \"2022-06-16T12:24:30Z\",\n      \"updated_at\": \"2022-06-16T12:24:30Z\"\n    },\n    {\n      \"id\": 76675,\n      \"type\": \"item\",\n      \"title\": \"Consulting\",\n      \"description\": null,\n      \"quantity\": 20.0,\n      \"unit\": \"h\",\n      \"unit_price\": 150.0,\n      \"net_total\": 3000.0,\n      \"unit_cost\": 0.0,\n      \"optional\": false,\n      \"part\": false,\n      \"additional\": false,\n      \"revenue_category\": {\n        \"id\": 127,\n        \"name\": \"Consulting\",\n        \"revenue_account\": 30059,\n        \"cost_category\": \"CO1\"\n      },\n      \"created_at\": \"2022-06-16T12:24:30Z\",\n      \"updated_at\": \"2022-06-16T12:24:30Z\"\n    }\n  ],\n  \"created_at\": \"2022-06-16T12:24:30Z\",\n  \"updated_at\": \"2022-06-16T12:24:30Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
      example:
        id: 20370
        title: Catalog entry
        items:
          -
            id: 113400
            type: item
            title: Setup
            description: null
            quantity: 0.0
            unit: null
            unit_price: 0.0
            net_total: 1200.0
            unit_cost: 0.0
            optional: false
            part: false
            additional: false
            revenue_category:
              id: 124
              name: Hosting
              revenue_account: 30056
              cost_category: HO1
            created_at: "2022-06-16T12:24:30Z"
            updated_at: "2022-06-16T12:24:30Z"
          -
            id: 76675
            type: item
            title: Consulting
            description: null
            quantity: 20.0
            unit: h
            unit_price: 150.0
            net_total: 3000.0
            unit_cost: 0.0
            optional: false
            part: false
            additional: false
            revenue_category:
              id: 127
              name: Consulting
              revenue_account: 30059
              cost_category: CO1
            created_at: "2022-06-16T12:24:30Z"
            updated_at: "2022-06-16T12:24:30Z"
        created_at: "2022-06-16T12:24:30Z"
        updated_at: "2022-06-16T12:24:30Z"
    CustomProperties:
      type: object
      description: "- **entity** \u2013 any kind of entity that a custom property can be added to\n- **kind** \u2013 `String` / `Textarea` / `Link` / `Boolean` / `Select` / `MultiSelect` / `Date`\n- **defaults** \u2013 for selections: the options that can be selected, empty strings are also valid.\n- **placeholder** \u2013 the placeholder text displayed on MOCO for input fields\n- **notification_enabled** \u2013 for kind `Date` a notification is sent to a user (dependent on the entity).\n\n```json\n{\n  \"id\": 8601,\n  \"name\": \"Purchase Order Number\",\n  \"name_alt\": \"Numero Identificativo Acquisto\",\n  \"placeholder\": \"\",\n  \"placeholder_alt\": \"\",\n  \"entity\": \"Project\",\n  \"kind\": \"String\",\n  \"print_on_invoice\": true,\n  \"print_on_offer\": false,\n  \"print_on_timesheet\": true,\n  \"notification_enabled\": false,\n  \"defaults\": [],\n  \"updated_at\": \"2022-08-15T15:31:28Z\",\n  \"created_at\": \"2022-08-15T15:31:22Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
      example:
        id: 8601
        name: Purchase Order Number
        name_alt: Numero Identificativo Acquisto
        placeholder: ""
        placeholder_alt: ""
        entity: Project
        kind: String
        print_on_invoice: true
        print_on_offer: false
        print_on_timesheet: true
        notification_enabled: false
        defaults:
          []
        updated_at: "2022-08-15T15:31:28Z"
        created_at: "2022-08-15T15:31:22Z"
