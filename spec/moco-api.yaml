          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaggingsTagAssociations"
              examples:
                example:
                  value:
                    tags:
                      - cool
                      - on hold
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaggingsTagAssociations"
            examples:
              example:
                value:
                  tags:
                    - cool
                    - on hold
      operationId: putTaggingsTaggingsTagAssociations
    delete:
