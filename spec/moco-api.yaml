paths:
  /account/catalog_services:
    get:
      summary: GET /account/catalog_services
      description: "Retrieve catalog services:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/account/catalog_services' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nreturns an array of catalog services including their items.\n\nAdditionally, the following parameters can be supplied:\n\n- [Global filters apply](../../entities#global-filters)"
      tags:
        - Catalog Services
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve catalog services:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/account/catalog_services' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nreturns an array of catalog services including their items."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogServices"
              examples:
                example:
                  value:
                    -
                      id: 20370
                      title: Catalog entry
                      items:
                        -
                          id: 113400
                          type: item
                          title: Setup
                          description: null
                          quantity: 0.0
                          unit: null
                          unit_price: 0.0
                          net_total: 1200.0
                          unit_cost: 0.0
                          optional: false
                          part: false
                          additional: false
                          revenue_category:
                            id: 124
                            name: Hosting
                            revenue_account: 30056
                            cost_category: HO1
                          created_at: "2022-06-16T12:24:30Z"
                          updated_at: "2022-06-16T12:24:30Z"
                        -
                          id: 76675
                          type: item
                          title: Consulting
                          description: null
                          quantity: 20.0
                          unit: h
                          unit_price: 150.0
                          net_total: 3000.0
                          unit_cost: 0.0
                          optional: false
                          part: false
                          additional: false
                          revenue_category:
                            id: 127
                            name: Consulting
                            revenue_account: 30059
                            cost_category: CO1
                          created_at: "2022-06-16T12:24:30Z"
                          updated_at: "2022-06-16T12:24:30Z"
                      created_at: "2022-06-16T12:24:30Z"
                      updated_at: "2022-06-16T12:24:30Z"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getAccountCatalog_ServicesCatalogServices
    post:
      summary: POST /account/catalog_services
      description: "Create a catalog service including their items\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/account/catalog_services' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"title\": \"Catalog entry\",\n        \"items\": [\n          {\n            \"type\": \"item\",\n            \"title\": \"Setup\",\n            \"net_total\": 1200.0\n          },\n          {\n            \"type\": \"item\",\n            \"title\": \"Consulting\",\n            \"quantity\": 20.0,\n            \"unit\": \"h\",\n            \"unit_price\": 150.0,\n            \"net_total\": 3000.0\n          }\n        ]\n      }'\n```"
      tags:
        - Catalog Services
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "Create a catalog service including their items\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/account/catalog_services' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"title\": \"Catalog entry\",\n        \"items\": [\n          {\n            \"type\": \"item\",\n            \"title\": \"Setup\",\n            \"net_total\": 1200.0\n          },\n          {\n            \"type\": \"item\",\n            \"title\": \"Consulting\",\n            \"quantity\": 20.0,\n            \"unit\": \"h\",\n            \"unit_price\": 150.0,\n            \"net_total\": 3000.0\n          }\n        ]\n      }'\n```"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServices"
              examples:
                example:
                  value:
                    title: Catalog entry
                    items:
                      -
                        type: item
                        title: Setup
                        net_total: 1200.0
                      -
                        type: item
                        title: Consulting
                        quantity: 20.0
                        unit: h
                        unit_price: 150.0
                        net_total: 3000.0
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogServices"
            examples:
              example:
                value:
                  title: Catalog entry
                  items:
                    -
                      type: item
                      title: Setup
                      net_total: 1200.0
                    -
                      type: item
                      title: Consulting
                      quantity: 20.0
                      unit: h
                      unit_price: 150.0
                      net_total: 3000.0
      operationId: postAccountCatalog_ServicesCatalogServices
