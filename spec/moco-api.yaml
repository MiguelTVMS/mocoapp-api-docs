    Offers:
      type: object
      description: "The offer representation contains among the standard fields:\n\n- custom properties\n- positions (items)\n- position types (\"title\", \"description\", \"item\", \"subtotal\", \"page-break\" or \"separator\")\n- subtotal_type: `part_total`, `sub_total`, `optional_part_total`, `optional_sub_total` (only relevant if type is `subtotal`)\n- vat (\"tax\", \"reverse_charge\", \"intra_eu\" (intra community trade, only applicable for accounts in the EU))\n- service_type (\"service\" for regular items, \"expense\" for additional services)\n\n```json\n{\n  \"id\": 273,\n  \"identifier\": \"A1704-042\",\n  \"invoice_id\": 1873491,\n  \"date\": \"2017-04-12\",\n  \"due_date\": \"2017-04-26\",\n  \"title\": \"Offer - User Management\",\n  \"recipient_address\": \"Beispiel GmbH\\nPeter Muster\\nBeispielstrasse 123\\n12345 Berlin\",\n  \"currency\": \"EUR\",\n  \"net_total\": 12750,\n  \"tax\": 19,\n  \"vat\": { \"tax\": 19.0, \"reverse_charge\": false, \"intra_eu\": false, \"active\": true, \"print_gross_total\": true, \"notice_tax_exemption\": \"\", \"notice_tax_exemption_alt\": \"\" },\n  \"gross_total\": 15172.5,\n  \"discount\": 10,\n  \"status\": \"created\",\n  \"salutation\": \"Hallo Peter<br><br>Folgende Aufw\u00e4nde sch\u00e4tzen wir f\u00fcr die Umsetzung der Komponenten:\",\n  \"footer\": \"F\u00fcr R\u00fcckfragen stehe ich dir jederzeit gerne zur Verf\u00fcgung.<br><br>Viele Gr\u00fcsse<br><br>Tobias\",\n  \"tags\": [\"Print\", \"Digital\"],\n  \"custom_properties\": {\n    \"ext-ref\": \"3421\"\n  },\n  \"company\": {\n    \"id\": 1234,\n    \"name\": \"Acme Corp.\"\n  },\n  \"project\": {\n    \"id\": 1234,\n    \"identifier\": \"P123\",\n    \"name\": \"A Project\"\n  },\n  \"deal\": {\n    \"id\": 1234,\n    \"name\": \"A Lead\"\n  },\n  \"user\": {\n    \"id\": 1234,\n    \"firstname\": \"Jane\",\n    \"lastname\": \"Doe\"\n  },\n  \"offer_confirmation\": {\n    \"id\": 1234,\n    \"date\": \"2022-12-12\",\n    \"title\": \"Offer confirmation\",\n    \"created_at\": \"2022-12-12T09:33:46Z\",\n    \"updated_at\": \"2022-12-12T09:33:46Z\"\n  },\n  \"customer_approval\": {\n    \"id\": 1234,\n    \"active\": true,\n    \"url\": \"https://mycompany.mocoapp.com/offers/1234/customer_approvals/ffbe642f6bdc65df7cb83a0d9459ece4\"\n  },\n  \"items\": [\n    {\n      \"id\": 29,\n      \"type\": \"item\",\n      \"title\": \"Project Setup\",\n      \"description\": null,\n      \"quantity\": 1,\n      \"unit\": \"d\",\n      \"unit_price\": 1500,\n      \"net_total\": 1500,\n      \"optional\": false\n      \"service_type\": \"service\",\n      \"revenue_category\": {\n        \"id\": 124,\n        \"name\": \"Hosting\",\n        \"revenue_account\": 30056,\n        \"cost_category\": \"HO1\"\n      }\n    },\n    {\n      \"id\": 30,\n      \"type\": \"item\",\n      \"title\": \"Master Data\",\n      \"description\": null,\n      \"quantity\": 3,\n      \"unit\": \"d\",\n      \"unit_price\": 1500,\n      \"net_total\": 4500,\n      \"optional\": false,\n      \"service_type\": \"service\",\n      \"revenue_category\": null\n    },\n    {\n      \"id\": 31,\n      \"type\": \"description\",\n      \"title\": null,\n      \"description\": \"Master data can be added.\",\n      \"quantity\": 0,\n      \"unit\": null,\n      \"unit_price\": 0,\n      \"net_total\": 0,\n      \"optional\": false,\n      \"service_type\": \"service\",\n      \"revenue_category\": null\n    },\n    {\n      \"id\": 34,\n      \"type\": \"item\",\n      \"title\": \"OAuth Provider (Single Sign On)\",\n      \"description\": null,\n      \"quantity\": 4,\n      \"unit\": \"d\",\n      \"unit_price\": 1500,\n      \"net_total\": 6000,\n      \"optional\": false,\n      \"service_type\": \"expense\",\n      \"revenue_category\": {\n        \"id\": 123,\n        \"name\": \"Software-Entwicklung\",\n        \"revenue_account\": 30055,\n        \"cost_category\": \"SW1\"\n      }\n    },\n    {\n      \"id\": 35,\n      \"type\": \"description\",\n      \"title\": null,\n      \"description\": \"This component runs centrally and provides an OAuth Provider.<br>Other applications can access this authorization service.\",\n      \"quantity\": 0,\n      \"unit\": null,\n      \"unit_price\": 0,\n      \"net_total\": 0,\n      \"optional\": false,\n      \"service_type\": \"service\",\n      \"revenue_category\": null\n    },\n    {\n      \"id\": 38,\n      \"type\": \"item\",\n      \"title\": \"Project Management / Communication / Hand-Over\",\n      \"description\": null,\n      \"quantity\": 0.5,\n      \"unit\": \"d\",\n      \"unit_price\": 1500,\n      \"net_total\": 750,\n      \"optional\": false,\n      \"service_type\": \"service\"\n      \"revenue_category\": {\n        \"id\": 126,\n        \"name\": \"Projektleitung\",\n        \"revenue_account\": 30058,\n        \"cost_category\": \"PM1\"\n      }\n    }\n  ],\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
