    Purchases:
      type: object
      description: "Includes among the standard fields for purchases also:\n\n- tags\n- company (if the purchase is associated to a supplier)\n- payments (list of payments made for the purchase)\n- user\n- status (`pending` = Inbox, `archived` = Archive)\n- approval_status (`none` = no approval requested, `approved` = all requests approved, `denied` = at least 1 denial none pending, `pending` = approvals still pending)\n- items\n- items.vat (\"tax\", \"reverse_charge\", \"intra_eu\" (intra community trade, only applicable for accounts in the EU))\n- items.expense (the associated project expense or `null`)\n- items.receipt (the associated receipt or `null`)\n\n```json\n{\n  \"id\": 987,\n  \"identifier\": \"E2016-0001\",\n  \"receipt_identifier\": \"KK121\",\n  \"title\": \"SBB Ticket\",\n  \"info\": null,\n  \"iban\": \"CH3908704016075473007\",\n  \"reference\": null,\n  \"date\": \"2020-02-28\",\n  \"due_date\": null,\n  \"service_period_from\": \"2020-02-28\",\n  \"service_period_to\": \"2020-02-28\",\n  \"status\": \"pending\",\n  \"payment_method\": \"bank_transfer\",\n  \"net_total\": 44.88,\n  \"gross_total\": 46.0,\n  \"currency\": \"CHF\",\n  \"file_url\": null,\n  \"custom_properties\": { \"Various\": \"some stuff\" },\n  \"tags\": [\"Transportation\"],\n  \"approval_status\": \"approved\",\n  \"company\": {\n    \"id\": 5552,\n    \"name\": \"Schweizerische Bundesbahnen SBB\",\n    \"iban\": \"CH3908704016075473007\"\n  },\n  \"payments\": [],\n  \"user\": {\n    \"id\": 433109936,\n    \"firstname\": \"Mario\",\n    \"name\": \"Rossi\"\n  },\n  \"refund_request\": {\n    \"id\": 66129936,\n    \"comment\": \"My receipts\",\n    \"user_id\": 123456\n  },\n  \"credit_card_transaction\": {\n    \"source\": \"pliant\",\n    \"transaction_identifier\": \"57a04fc8-a56e-4be6-acb2-241b513f0570\"\n  },\n  \"items\": [\n    {\n      \"id\": 311936153,\n      \"title\": \"SBB Ticket\",\n      \"net_total\": 44.88,\n      \"tax_total\": 1.12,\n      \"tax\": 2.5,\n      \"vat\": { \"tax\": 2.5, \"reverse_charge\": false, \"intra_eu\": false, \"active\": true },\n      \"tax_included\": true,\n      \"gross_total\": 46.0,\n      \"category\": {\n        \"id\": 671034328,\n        \"name\": \"Spesen und Reisekosten\",\n        \"credit_account\": \"6640\"\n      },\n      \"supplier_credit_number\": 70001,\n      \"expense\": {\n        \"id\": 7655423,\n        \"project\": {\n          \"id\": 23345545,\n          \"company_id\": 54345\n        }\n      },\n      \"receipt\": {\n        \"id\": 9857765,\n        \"title\": \"SBB Ticket\",\n        \"date\": \"2018-10-01\",\n        \"attachment_url\": \"https://...\"\n      }\n    }\n  ],\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
