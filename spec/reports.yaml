openapi: 3.1.0
info:
  title: Reports API
  version: 1.0.0
  description: "German: \"Berichte\"\n\n- TOC\n\n## General\n- Request payloads to MOCO must be sent as valid JSON with a mandatory `Content-Type: application/json`-header. Responses are also sent as JSON.\n- All requests have to be [authenticated](authentication) with a key\n- Example responses showcase the happy case, i.e. usually the `200 OK` response\n- Collections are usually [paginated](#pagination)\n- Zapier triggers are **not** triggered for API requests\n- Timestamps `created_at` and `updated_at` are sent for all entities in UTC, as ISO8601 format.\n- For synchronization almost all resources can be filtered by `updated_after` passing a time in UTC, as ISO8601 format.\n- MOCO does not support any client-libraries at the moment. However, there are currently the following unofficial clients available, which you can use at your risk: [Python Client](https://github.com/sommalia/moco-wrapper)\n\n## Entities\nAll the entities exposed via the API can be found in their [respective sections](entities.md)\n\n## Client Implementations / API Wrappers\nHere's a list of API client implementations, not maintained by us. Feel free to open up a PR to point to your implementation so others can re-use it.\n\n| Language |                Repository                                                                            |\n| :------: | :-------------------------------------------------------------------------------------------------:  |\n| Python   | [https://github.com/sommalia/moco-wrapper](https://github.com/sommalia/moco-wrapper)                 |\n| PHP      | [https://github.com/mbs-hub/moco-php](https://github.com/mbs-hub/moco-php)                           |\n| Ruby     | [https://github.com/starsong-consulting/moco-ruby](https://github.com/starsong-consulting/moco-ruby) |\n\n## Impersonation\nBy default all requests are scoped to the authenticated user. Some resources cannot be provided with a `user_id` or similar, like `Activities` and `User Presences`. This reflects the behaviour in the UI, since every user can only create their own activities or presences. But you can login as another user provided that the authenticated user has permission to _Staff_. To achieve the same behaviour in the API, one can set the following x-header:\n\n`X-IMPERSONATE-USER-ID=123` (user id to act in behalf of)\n\n## Rate Limiting\nYou can expect to be able to send 120 requests per 2 minutes (~ 1 request per second). For the unlimited plan, its 1200 requests per 2 minutes (~ 10 per second). If you exceed this limit, the server responds with `429 Too Many Requests`.\n\n## Pagination\nResponses are paginated with a common default of 100 entries per page. In the HTTP response header, the current page, the entries per page and the number of total entries is reported. There is also a link header to links to the consecutive page.\n\n- **X-Page** \u2013 3\n- **X-Per-Page** \u2013 100\n- **X-Total** \u2013 415\n- **Link** \u2013 `<https://{domain}.mocoapp.com/api/v1/projects.json?page=4>; rel=\"next\"`\n\nIf there is not Link header with `rel=\"next\"`, the current page is the last page.\n\n## Errors and HTTP status codes\nThe MOCO-API is mostly conformant with the [general HTTP status codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes).\n\nHere are the most comment errors you will see:\n\n- **401 Unauthorized** - Check the error message in the response body\n- **403 Forbidden** - Check your [Authentication](#authentication) or your MOCO user permission\n- **404 Not Found** - Check that resource exists (maybe it was deleted in the meantime)\n- **422 Unprocessable Entity** - Check the provided error message in the response body\n- **429 Too Many Requests** - Check [Rate Limiting](#rate-limiting)\n\nSorting is controlled by the `sort_by` query parameter. Its value is the field name that should be sorted, followed by an optional sorting order (`asc` or `desc`, default is `asc`).\n\nExample:\n\n- `https://{domain}.mocoapp.com/api/v1/offers?sort_by=title desc`"
servers:
  -
    url: "https://{domain}.mocoapp.com/api/v1"
    description: Base server URL for the MOCO API.
tags:
  -
    name: Reports
    description: "German: \"Berichte\"\n\n- TOC"
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "There's two ways to authenticate against MOCO:\n\n1. **User API key**. Can be found under the \"Integrations\" tab on the profile page.\n2. **Account API key**. Has to be created in Settings > Extensions > API & Webhooks, with either read-only or full access on all endpoints.\n\nBoth kinds of keys are provided as an Authorization header.\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects.json' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThis key can also be requested via API for user-specific keys:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"email\": \"max@muster.de\",\n    \"password\": \"secret\"\n  }'\n```\n\nIt's also possible to verify if the API key is still valid:\n\n```bash\ncurl https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json'\n```\n\nIf the key is valid, the response code id `200 ok` and the body is:\n\n```json\n{\n  \"id\": 123,\n  \"uuid\": \"aec324a2-4832-11eb-b378-0242ac130002\"\n}\n```\n\notherwise the response code is `401 unauthorized`.\nThere are a few tools to try out the MOCO API. All the examples in this documentation use `curl` to demonstrate the API endpoint.\nA popular graphical UI for REST is [Postman](https://www.postman.com/). Here's an example request for the projects list including the authentication:\n\n![Postman example request](moco-api-postman.png \"Postman example request\")"
  parameters:
    Page:
      name: page
      in: query
      description: Pagination support as described in the general documentation.
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Number of items per page for paginated responses.
      schema:
        type: integer
        minimum: 1
    SortBy:
      name: sort_by
      in: query
      description: Sorting is controlled by the `sort_by` query parameter. Provide the field name and optional order (asc or desc).
      schema:
        type: string
    Ids:
      name: ids
      in: query
      description: "Usage: `GET /api/v1/entities?ids=123,456`\n\nAllows you to filter by comma-separated IDs and fetch multiple entities."
      schema:
        type: string
    UpdatedAfter:
      name: updated_after
      in: query
      description: "Usage: `GET /api/v1/entities?updated_after=2022-04-20T09:17:58Z` (ISO8601 timestamp)\n\nEnables you to give a timestamp for all entities that are created or updated after this timestamp, especially useful for synchronisation purposes.\n\nCombine it with a [webhook subscription](webhooks) on DELETE for the entity to have a complete synchronisation."
      schema:
        type: string
        format: "date-time"
    CustomProperties:
      name: custom_properties
      in: query
      description: "Allows you to filter entities by one or more custom fields. The filter for the custom fields is passed via the query-parameter `custom_properties`. To query entities that contain the value \"Automotive\" in a custom field named \"Sector\", the query would need to be as follows:\n\n`GET /api/v1/entities?custom_properties[Sector]=Automotive`\n\nFiltering by an unknown custom field will result in an empty result set!"
      schema:
        type: object
        additionalProperties: true
      style: deepObject
      explode: true
  schemas:
    ErrorResponse:
      type: object
      description: Generic error response body.
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    Reports:
      type: object
      description: "Custom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
security:
  -
    TokenAuth:
      []
paths:
  /report/absences:
    get:
      summary: GET /report/absences
      description: "Retrieve a list of absences per user:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/absences' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's also possible to filter:\n\n- **active** - true/false (include only absences for active users, defaults to false)\n- **year** - 2021 (defaults to current year)\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"user\": {\n      \"id\": 123,\n      \"firstname\": \"Jane\",\n      \"lastname\": \"Doe\"\n    },\n    \"total_vacation_days\": 25.0,\n    \"used_vacation_days\": 10.5,\n    \"planned_vacation_days\": 5.0,\n    \"sickdays\": 4.0\n  }\n]\n```"
      tags:
        - Reports
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve a list of absences per user:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/absences' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's also possible to filter:\n\n- **active** - true/false (include only absences for active users, defaults to false)\n- **year** - 2021 (defaults to current year)\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"user\": {\n      \"id\": 123,\n      \"firstname\": \"Jane\",\n      \"lastname\": \"Doe\"\n    },\n    \"total_vacation_days\": 25.0,\n    \"used_vacation_days\": 10.5,\n    \"planned_vacation_days\": 5.0,\n    \"sickdays\": 4.0\n  }\n]\n```"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reports"
              examples:
                example:
                  value:
                    -
                      user:
                        id: 123
                        firstname: Jane
                        lastname: Doe
                      total_vacation_days: 25.0
                      used_vacation_days: 10.5
                      planned_vacation_days: 5.0
                      sickdays: 4.0
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getReportAbsencesReports
  /report/cashflow:
    get:
      summary: GET /report/cashflow
      description: "Retrieve the cashflow report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/cashflow' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's possible to filter:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n- **term** - text\n\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"record_id\": 28206351,\n    \"company_id\": 760383472,\n    \"description\": \"R2212-022 Invoice\",\n    \"user_id\": 933622946,\n    \"amount_in_account_currency\": 1022.07,\n    \"kind\": \"invoice_created\",\n    \"company\": {\n      \"id\": 760683172,\n      \"name\": \"Kronenhalle Bar\"\n    },\n    \"user\": {\n      \"id\": 933622946,\n      \"firstname\": \"John\",\n      \"lastname\": \"Doe\"\n    },\n    \"date\": \"2024-09-17\"\n  }\n]\n```"
      tags:
        - Reports
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve the cashflow report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/cashflow' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's possible to filter:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n- **term** - text\n\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"record_id\": 28206351,\n    \"company_id\": 760383472,\n    \"description\": \"R2212-022 Invoice\",\n    \"user_id\": 933622946,\n    \"amount_in_account_currency\": 1022.07,\n    \"kind\": \"invoice_created\",\n    \"company\": {\n      \"id\": 760683172,\n      \"name\": \"Kronenhalle Bar\"\n    },\n    \"user\": {\n      \"id\": 933622946,\n      \"firstname\": \"John\",\n      \"lastname\": \"Doe\"\n    },\n    \"date\": \"2024-09-17\"\n  }\n]\n```"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reports"
              examples:
                example:
                  value:
                    -
                      record_id: 28206351
                      company_id: 760383472
                      description: "R2212-022 Invoice"
                      user_id: 933622946
                      amount_in_account_currency: 1022.07
                      kind: invoice_created
                      company:
                        id: 760683172
                        name: Kronenhalle Bar
                      user:
                        id: 933622946
                        firstname: John
                        lastname: Doe
                      date: "2024-09-17"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getReportCashflowReports
  /report/finance:
    get:
      summary: GET /report/finance
      description: "Retrieve the finance report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/finance' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's possible to filter:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n- **term** - text\n\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"record_id\": 3731655,\n    \"company_id\": 760718470,\n    \"description\":\"ZL 1\",\n    \"user_id\": 933621267,\n    \"net_amount_in_account_currency\": 100.0,\n    \"kind\": \"incoming_expenses\",\n    \"company\": {\n      \"id\": 762768470,\n      \"name\":\"Maus AG\"\n    },\n    \"user\": {\n      \"id\":933621267,\n      \"firstname\": \"Jenni\",\n      \"lastname\": \"Doe\"\n    },\n    \"date\":\"2025-03-27\"\n  }\n]\n```"
      tags:
        - Reports
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve the finance report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/finance' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's possible to filter:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n- **term** - text\n\n\nThis returns an array with the following structure:\n\n```json\n[\n  {\n    \"record_id\": 3731655,\n    \"company_id\": 760718470,\n    \"description\":\"ZL 1\",\n    \"user_id\": 933621267,\n    \"net_amount_in_account_currency\": 100.0,\n    \"kind\": \"incoming_expenses\",\n    \"company\": {\n      \"id\": 762768470,\n      \"name\":\"Maus AG\"\n    },\n    \"user\": {\n      \"id\":933621267,\n      \"firstname\": \"Jenni\",\n      \"lastname\": \"Doe\"\n    },\n    \"date\":\"2025-03-27\"\n  }\n]\n```"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reports"
              examples:
                example:
                  value:
                    -
                      record_id: 3731655
                      company_id: 760718470
                      description: ZL 1
                      user_id: 933621267
                      net_amount_in_account_currency: 100.0
                      kind: incoming_expenses
                      company:
                        id: 762768470
                        name: Maus AG
                      user:
                        id: 933621267
                        firstname: Jenni
                        lastname: Doe
                      date: "2025-03-27"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getReportFinanceReports
  /report/utilization:
    get:
      summary: GET /report/utilization
      description: "Retrieve the utilization report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/utilization?from={from_date}&to={to_date}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThe parameters `from` and `to` are required:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n\n```json\n[\n  {\n    \"date\": \"2025-08-20\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 4.3,\n    \"unbillable_hours\": 0.83,\n    \"billable_seconds\": 15487,\n    \"unbillable_seconds\": 3000\n  },\n  {\n    \"date\": \"2025-08-21\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 2.0,\n    \"unbillable_hours\": 3.83,\n    \"billable_seconds\": 7200,\n    \"unbillable_seconds\": 13800\n  },\n  {\n    \"date\": \"2025-08-22\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 3.33,\n    \"unbillable_hours\": 3.5,\n    \"billable_seconds\": 12000,\n    \"unbillable_seconds\": 12600\n  },\n  {\n    \"date\": \"2025-08-20\",\n    \"user_id\": 93346,\n    \"target_hours\": 8.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.0,\n    \"billable_seconds\": 0.0,\n    \"unbillable_seconds\": 0.0\n  },\n  {\n    \"date\": \"2025-08-21\",\n    \"user_id\": 93346,\n    \"target_hours\": 4.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.0,\n    \"billable_seconds\": 0.0,\n    \"unbillable_seconds\": 0.0\n  },\n  {\n    \"date\": \"2025-08-22\",\n    \"user_id\": 93346,\n    \"target_hours\": 8.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.25,\n    \"billable_seconds\": 0,\n    \"unbillable_seconds\": 900\n  }\n]\n```"
      tags:
        - Reports
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve the utilization report:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/report/utilization?from={from_date}&to={to_date}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThe parameters `from` and `to` are required:\n\n- **from** - 2025-01-01\n- **to** - 2025-12-31\n\n```json\n[\n  {\n    \"date\": \"2025-08-20\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 4.3,\n    \"unbillable_hours\": 0.83,\n    \"billable_seconds\": 15487,\n    \"unbillable_seconds\": 3000\n  },\n  {\n    \"date\": \"2025-08-21\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 2.0,\n    \"unbillable_hours\": 3.83,\n    \"billable_seconds\": 7200,\n    \"unbillable_seconds\": 13800\n  },\n  {\n    \"date\": \"2025-08-22\",\n    \"user_id\": 92345,\n    \"target_hours\": 6.4,\n    \"billable_hours\": 3.33,\n    \"unbillable_hours\": 3.5,\n    \"billable_seconds\": 12000,\n    \"unbillable_seconds\": 12600\n  },\n  {\n    \"date\": \"2025-08-20\",\n    \"user_id\": 93346,\n    \"target_hours\": 8.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.0,\n    \"billable_seconds\": 0.0,\n    \"unbillable_seconds\": 0.0\n  },\n  {\n    \"date\": \"2025-08-21\",\n    \"user_id\": 93346,\n    \"target_hours\": 4.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.0,\n    \"billable_seconds\": 0.0,\n    \"unbillable_seconds\": 0.0\n  },\n  {\n    \"date\": \"2025-08-22\",\n    \"user_id\": 93346,\n    \"target_hours\": 8.0,\n    \"billable_hours\": 0.0,\n    \"unbillable_hours\": 0.25,\n    \"billable_seconds\": 0,\n    \"unbillable_seconds\": 900\n  }\n]\n```"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reports"
              examples:
                example:
                  value:
                    -
                      date: "2025-08-20"
                      user_id: 92345
                      target_hours: 6.4
                      billable_hours: 4.3
                      unbillable_hours: 0.83
                      billable_seconds: 15487
                      unbillable_seconds: 3000
                    -
                      date: "2025-08-21"
                      user_id: 92345
                      target_hours: 6.4
                      billable_hours: 2.0
                      unbillable_hours: 3.83
                      billable_seconds: 7200
                      unbillable_seconds: 13800
                    -
                      date: "2025-08-22"
                      user_id: 92345
                      target_hours: 6.4
                      billable_hours: 3.33
                      unbillable_hours: 3.5
                      billable_seconds: 12000
                      unbillable_seconds: 12600
                    -
                      date: "2025-08-20"
                      user_id: 93346
                      target_hours: 8.0
                      billable_hours: 0.0
                      unbillable_hours: 0.0
                      billable_seconds: 0.0
                      unbillable_seconds: 0.0
                    -
                      date: "2025-08-21"
                      user_id: 93346
                      target_hours: 4.0
                      billable_hours: 0.0
                      unbillable_hours: 0.0
                      billable_seconds: 0.0
                      unbillable_seconds: 0.0
                    -
                      date: "2025-08-22"
                      user_id: 93346
                      target_hours: 8.0
                      billable_hours: 0.0
                      unbillable_hours: 0.25
                      billable_seconds: 0
                      unbillable_seconds: 900
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getReportUtilizationReports
