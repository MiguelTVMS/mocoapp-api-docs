openapi: 3.1.0
info:
  title: Project Expenses API
  version: 1.0.0
  description: "German: \"Projekte / Zusatzleistungen\"\n\n- TOC\n\n## General\n- Request payloads to MOCO must be sent as valid JSON with a mandatory `Content-Type: application/json`-header. Responses are also sent as JSON.\n- All requests have to be [authenticated](authentication) with a key\n- Example responses showcase the happy case, i.e. usually the `200 OK` response\n- Collections are usually [paginated](#pagination)\n- Zapier triggers are **not** triggered for API requests\n- Timestamps `created_at` and `updated_at` are sent for all entities in UTC, as ISO8601 format.\n- For synchronization almost all resources can be filtered by `updated_after` passing a time in UTC, as ISO8601 format.\n- MOCO does not support any client-libraries at the moment. However, there are currently the following unofficial clients available, which you can use at your risk: [Python Client](https://github.com/sommalia/moco-wrapper)\n\n## Entities\nAll the entities exposed via the API can be found in their [respective sections](entities.md)\n\n## Client Implementations / API Wrappers\nHere's a list of API client implementations, not maintained by us. Feel free to open up a PR to point to your implementation so others can re-use it.\n\n| Language |                Repository                                                                            |\n| :------: | :-------------------------------------------------------------------------------------------------:  |\n| Python   | [https://github.com/sommalia/moco-wrapper](https://github.com/sommalia/moco-wrapper)                 |\n| PHP      | [https://github.com/mbs-hub/moco-php](https://github.com/mbs-hub/moco-php)                           |\n| Ruby     | [https://github.com/starsong-consulting/moco-ruby](https://github.com/starsong-consulting/moco-ruby) |\n\n## Impersonation\nBy default all requests are scoped to the authenticated user. Some resources cannot be provided with a `user_id` or similar, like `Activities` and `User Presences`. This reflects the behaviour in the UI, since every user can only create their own activities or presences. But you can login as another user provided that the authenticated user has permission to _Staff_. To achieve the same behaviour in the API, one can set the following x-header:\n\n`X-IMPERSONATE-USER-ID=123` (user id to act in behalf of)\n\n## Rate Limiting\nYou can expect to be able to send 120 requests per 2 minutes (~ 1 request per second). For the unlimited plan, its 1200 requests per 2 minutes (~ 10 per second). If you exceed this limit, the server responds with `429 Too Many Requests`.\n\n## Pagination\nResponses are paginated with a common default of 100 entries per page. In the HTTP response header, the current page, the entries per page and the number of total entries is reported. There is also a link header to links to the consecutive page.\n\n- **X-Page** \u2013 3\n- **X-Per-Page** \u2013 100\n- **X-Total** \u2013 415\n- **Link** \u2013 `<https://{domain}.mocoapp.com/api/v1/projects.json?page=4>; rel=\"next\"`\n\nIf there is not Link header with `rel=\"next\"`, the current page is the last page.\n\n## Errors and HTTP status codes\nThe MOCO-API is mostly conformant with the [general HTTP status codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes).\n\nHere are the most comment errors you will see:\n\n- **401 Unauthorized** - Check the error message in the response body\n- **403 Forbidden** - Check your [Authentication](#authentication) or your MOCO user permission\n- **404 Not Found** - Check that resource exists (maybe it was deleted in the meantime)\n- **422 Unprocessable Entity** - Check the provided error message in the response body\n- **429 Too Many Requests** - Check [Rate Limiting](#rate-limiting)\n\nSorting is controlled by the `sort_by` query parameter. Its value is the field name that should be sorted, followed by an optional sorting order (`asc` or `desc`, default is `asc`).\n\nExample:\n\n- `https://{domain}.mocoapp.com/api/v1/offers?sort_by=title desc`"
servers:
  -
    url: "https://{domain}.mocoapp.com/api/v1"
    description: Base server URL for the MOCO API.
tags:
  -
    name: Project Expenses
    description: "German: \"Projekte / Zusatzleistungen\"\n\n- TOC"
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "There's two ways to authenticate against MOCO:\n\n1. **User API key**. Can be found under the \"Integrations\" tab on the profile page.\n2. **Account API key**. Has to be created in Settings > Extensions > API & Webhooks, with either read-only or full access on all endpoints.\n\nBoth kinds of keys are provided as an Authorization header.\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects.json' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThis key can also be requested via API for user-specific keys:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"email\": \"max@muster.de\",\n    \"password\": \"secret\"\n  }'\n```\n\nIt's also possible to verify if the API key is still valid:\n\n```bash\ncurl https://{domain}.mocoapp.com/api/v1/session \\\n  -H 'Accept: application/json' \\\n  -H 'Content-Type: application/json'\n```\n\nIf the key is valid, the response code id `200 ok` and the body is:\n\n```json\n{\n  \"id\": 123,\n  \"uuid\": \"aec324a2-4832-11eb-b378-0242ac130002\"\n}\n```\n\notherwise the response code is `401 unauthorized`.\nThere are a few tools to try out the MOCO API. All the examples in this documentation use `curl` to demonstrate the API endpoint.\nA popular graphical UI for REST is [Postman](https://www.postman.com/). Here's an example request for the projects list including the authentication:\n\n![Postman example request](moco-api-postman.png \"Postman example request\")"
  parameters:
    Page:
      name: page
      in: query
      description: Pagination support as described in the general documentation.
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Number of items per page for paginated responses.
      schema:
        type: integer
        minimum: 1
    SortBy:
      name: sort_by
      in: query
      description: Sorting is controlled by the `sort_by` query parameter. Provide the field name and optional order (asc or desc).
      schema:
        type: string
    Ids:
      name: ids
      in: query
      description: "Usage: `GET /api/v1/entities?ids=123,456`\n\nAllows you to filter by comma-separated IDs and fetch multiple entities."
      schema:
        type: string
    UpdatedAfter:
      name: updated_after
      in: query
      description: "Usage: `GET /api/v1/entities?updated_after=2022-04-20T09:17:58Z` (ISO8601 timestamp)\n\nEnables you to give a timestamp for all entities that are created or updated after this timestamp, especially useful for synchronisation purposes.\n\nCombine it with a [webhook subscription](webhooks) on DELETE for the entity to have a complete synchronisation."
      schema:
        type: string
        format: "date-time"
    CustomProperties:
      name: custom_properties
      in: query
      description: "Allows you to filter entities by one or more custom fields. The filter for the custom fields is passed via the query-parameter `custom_properties`. To query entities that contain the value \"Automotive\" in a custom field named \"Sector\", the query would need to be as follows:\n\n`GET /api/v1/entities?custom_properties[Sector]=Automotive`\n\nFiltering by an unknown custom field will result in an empty result set!"
      schema:
        type: object
        additionalProperties: true
      style: deepObject
      explode: true
  schemas:
    ErrorResponse:
      type: object
      description: Generic error response body.
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    ProjectExpenses:
      type: object
      description: "The representation contains, among the standard fields, also the following fields:\n\n- Custom properties\n- Company\n- Project\n- Group\n\n```json\n{\n  \"id\": 47266,\n  \"date\": \"2024-06-07\",\n  \"title\": \"Hosting XS\",\n  \"description\": \"<div>Hosting, Monitoring und Backup</div>\",\n  \"quantity\": 3,\n  \"unit\": \"Monat\",\n  \"unit_price\": 29,\n  \"unit_cost\": 19,\n  \"price\": 87,\n  \"cost\": 57,\n  \"currency\": \"CHF\",\n  \"budget_relevant\": true,\n  \"billable\": true,\n  \"billed\": false,\n  \"purchase_assignment_locked\": true,\n  \"cost_total_planned\": 0,\n  \"planned_purchase_date\": null,\n  \"invoice_id\": null,\n  \"recurring_expense_id\": null,\n  \"service_period\": \"06/2024\",\n  \"service_period_from\": \"2024-06-01\",\n  \"service_period_to\": \"2024-06-30\",\n  \"file_url\": \"https//meinefirma.mocoapp.com/.../beleg1.jpg\",\n  \"revenue_category\": {\n    \"id\": 124,\n    \"name\": \"Hosting\",\n    \"revenue_account\": 30056,\n    \"cost_category\": \"HO1\"\n  },\n  \"custom_properties\": {\n    \"Type\": \"Website\"\n  },\n  \"company\": {\n    \"id\": 1234,\n    \"name\": \"Acme Corp.\"\n  },\n  \"project\": {\n    \"id\": 1234,\n    \"name\": \"Project A\"\n  },\n  \"group\": {\n    \"id\": 456,\n    \"title\": \"Exepnse Group A\",\n    \"budget\": 5200\n  },\n  \"purchase_items\": [\n    {\n      \"id\": 1234,\n      \"title\": \"Item Title\",\n      \"net_total\", 12.0,\n      \"currency\": \"EUR\",\n      \"purchase_id\": 345,\n      \"document\": {\n        \"id\": 567,\n        \"file_url\": \"https://...\"\n      }\n    }\n  ],\n  \"created_at\": \"2024-06-06T09:33:46Z\",\n  \"updated_at\": \"2024-06-06T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
security:
  -
    TokenAuth:
      []
paths:
  /projects/{id}/expenses:
    get:
      summary: "GET /projects/{id}/expenses"
      description: "Retrieve all additional services for a project:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThis returns an array with all additional services (see Attributes).\n\nAdditionally, these parameters can be supplied:\n\n- [Global filters apply](../entities#global-filters)\n- **billable** \u2013 true/false\n- **billed** \u2013 true/false\n- **budget_relevant** \u2013 true/false\n- **user_id** - 123456 (user that created expense)"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        200:
          description: "Retrieve all additional services for a project:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nThis returns an array with all additional services (see Attributes)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExpenses"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getProjectsIdExpensesProjectExpenses
    post:
      summary: "POST /projects/{id}/expenses"
      description: "Create an additional service entry on a project:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"date\": \"2018-10-01\",\n        \"title\": \"Hosting XS\",\n        \"quantity\": 3,\n        \"unit\": \"months\",\n        \"unit_price\": 29,\n        \"unit_cost\": 19,\n        \"file\": {\n          \"filename\": \"document.pdf\",\n          \"base64\": \"JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...\"\n        }\n      }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2017-04-12\"\n- **title\\*** \u2013 \"Hosting XS\"\n- **quantity\\*** \u2013 3\n- **unit\\*** \u2013 \"months\"\n- **unit_price\\*** \u2013 29\n- **unit_cost\\*** \u2013 19\n- **description** \u2013 \"Hosting, Monitoring, Backup\"\n- **billable** \u2013 true/false (default: true)\n- **budget_relevant** \u2013 true/false (default: false)\n- **service_period_from** \u2013 \"2021-01-01\"\n- **service_period_to** \u2013 \"2021-01-31\"\n- **user_id** - 456 (user responsible, current user by default)\n- **custom_properties** \u2013 {\"Type\": \"Website\"}\n- **file** \u2013 file attached to the expense, with the following fields:\n  - filename \u2013 \"document.pdf\"\n  - base64 \u2013 base64 encoded content of the file"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "Create an additional service entry on a project:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"date\": \"2018-10-01\",\n        \"title\": \"Hosting XS\",\n        \"quantity\": 3,\n        \"unit\": \"months\",\n        \"unit_price\": 29,\n        \"unit_cost\": 19,\n        \"file\": {\n          \"filename\": \"document.pdf\",\n          \"base64\": \"JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...\"\n        }\n      }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2017-04-12\"\n- **title\\*** \u2013 \"Hosting XS\"\n- **quantity\\*** \u2013 3\n- **unit\\*** \u2013 \"months\"\n- **unit_price\\*** \u2013 29\n- **unit_cost\\*** \u2013 19\n- **description** \u2013 \"Hosting, Monitoring, Backup\"\n- **billable** \u2013 true/false (default: true)\n- **budget_relevant** \u2013 true/false (default: false)\n- **service_period_from** \u2013 \"2021-01-01\"\n- **service_period_to** \u2013 \"2021-01-31\"\n- **user_id** - 456 (user responsible, current user by default)\n- **custom_properties** \u2013 {\"Type\": \"Website\"}\n- **file** \u2013 file attached to the expense, with the following fields:\n  - filename \u2013 \"document.pdf\"\n  - base64 \u2013 base64 encoded content of the file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExpenses"
              examples:
                example:
                  value:
                    date: "2018-10-01"
                    title: Hosting XS
                    quantity: 3
                    unit: months
                    unit_price: 29
                    unit_cost: 19
                    file:
                      filename: document.pdf
                      base64: JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectExpenses"
            examples:
              example:
                value:
                  date: "2018-10-01"
                  title: Hosting XS
                  quantity: 3
                  unit: months
                  unit_price: 29
                  unit_cost: 19
                  file:
                    filename: document.pdf
                    base64: JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...
      operationId: postProjectsIdExpensesProjectExpenses
  /projects/{id}/expenses/{id}:
    get:
      summary: "GET /projects/{id}/expenses/{id}"
      description: "Retrieve a single additional service for a project:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/{id}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        200:
          description: "Retrieve a single additional service for a project:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/{id}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExpenses"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getProjectsIdExpensesIdProjectExpenses
    put:
      summary: "PUT /projects/{id}/expenses/{id}"
      description: "Update an additional services entry on a project:\n\n```bash\ncurl -X PUT \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/{id}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"unit_price\": 49\n      }'\n```\n\nFields are analogous to the POST request. Updates are only possible if this entry is not yet billed."
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        200:
          description: "Update an additional services entry on a project:\n\n```bash\ncurl -X PUT \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/{id}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"unit_price\": 49\n      }'\n```\n\nFields are analogous to the POST request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExpenses"
              examples:
                example:
                  value:
                    unit_price: 49
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectExpenses"
            examples:
              example:
                value:
                  unit_price: 49
      operationId: putProjectsIdExpensesIdProjectExpenses
    delete:
      summary: "DELETE /projects/{id}/expenses/{id}"
      description: "Delete an additional services entry on a project.\n\nDeletions are only possible if this entry is not yet billed.\n\n```bash\ncurl -X DELETE \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/{id}' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        204:
          description: Delete an additional services entry on a project.
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: deleteProjectsIdExpensesIdProjectExpenses
  /projects/{id}/expenses/bulk:
    post:
      summary: "POST /projects/{id}/expenses/bulk"
      description: "Create multiple additional services entries:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/bulk' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"bulk_data\": [\n          {\n            \"date\": \"2018-10-20\",\n            \"title\": \"Hosting: Server\",\n            \"quantity\": 1,\n            \"unit\": \"Server\",\n            \"unit_price\": 29,\n            \"unit_cost\": 19\n          },\n          {\n            \"date\": \"2018-10-22\",\n            \"title\": \"Hosting: Server\",\n            \"quantity\": 1,\n            \"unit\": \"Server\",\n            \"unit_price\": 29,\n            \"unit_cost\": 19\n          }\n        ]\n      }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2017-04-12\"\n- **title\\*** \u2013 \"Hosting XS\"\n- **quantity\\*** \u2013 3\n- **unit\\*** \u2013 \"months\"\n- **unit_price\\*** \u2013 29\n- **unit_cost\\*** \u2013 19\n- **description** \u2013 \"Hosting, Monitoring, Backup\"\n- **billable** \u2013 true/false (default: true)\n- **budget_relevant** \u2013 true/false (default: false)"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "Create multiple additional services entries:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/bulk' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"bulk_data\": [\n          {\n            \"date\": \"2018-10-20\",\n            \"title\": \"Hosting: Server\",\n            \"quantity\": 1,\n            \"unit\": \"Server\",\n            \"unit_price\": 29,\n            \"unit_cost\": 19\n          },\n          {\n            \"date\": \"2018-10-22\",\n            \"title\": \"Hosting: Server\",\n            \"quantity\": 1,\n            \"unit\": \"Server\",\n            \"unit_price\": 29,\n            \"unit_cost\": 19\n          }\n        ]\n      }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2017-04-12\"\n- **title\\*** \u2013 \"Hosting XS\"\n- **quantity\\*** \u2013 3\n- **unit\\*** \u2013 \"months\"\n- **unit_price\\*** \u2013 29\n- **unit_cost\\*** \u2013 19\n- **description** \u2013 \"Hosting, Monitoring, Backup\"\n- **billable** \u2013 true/false (default: true)\n- **budget_relevant** \u2013 true/false (default: false)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExpenses"
              examples:
                example:
                  value:
                    bulk_data:
                      -
                        date: "2018-10-20"
                        title: "Hosting: Server"
                        quantity: 1
                        unit: Server
                        unit_price: 29
                        unit_cost: 19
                      -
                        date: "2018-10-22"
                        title: "Hosting: Server"
                        quantity: 1
                        unit: Server
                        unit_price: 29
                        unit_cost: 19
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectExpenses"
            examples:
              example:
                value:
                  bulk_data:
                    -
                      date: "2018-10-20"
                      title: "Hosting: Server"
                      quantity: 1
                      unit: Server
                      unit_price: 29
                      unit_cost: 19
                    -
                      date: "2018-10-22"
                      title: "Hosting: Server"
                      quantity: 1
                      unit: Server
                      unit_price: 29
                      unit_cost: 19
      operationId: postProjectsIdExpensesBulkProjectExpenses
  /projects/{id}/expenses/disregard:
    post:
      summary: "POST /projects/{id}/expenses/disregard"
      description: "Mark additional services entries as \"already billed\".\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/projects/{id}/expenses/disregard' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"expense_ids\": [1234, 5678],\n        \"reason\": \"Courtesy services, as discussed\"\n      }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **reason\\*** \u2013 \"Courtesy services, as discussed\"\n- **expense_ids\\*** \u2013 [1234, 5678]"
      tags:
        - Project Expenses
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "Mark additional services entries as \"already billed\"."
          content:
            application/json:
