      description: "Assigning staff to a project is defined in Moco as a \"contract\".\n\n```json\n{\n  \"id\": 760253573,\n  \"user_id\": 938487474,\n  \"firstname\": \"Nicola\",\n  \"lastname\": \"Piccinini\",\n  \"billable\": true,\n  \"active\": true,\n  \"budget\": 9900,\n  \"hourly_rate\": 110,\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
      example:
        id: 760253573
        user_id: 938487474
        firstname: Nicola
        lastname: Piccinini
        billable: true
        active: true
        budget: 9900
        hourly_rate: 110
        created_at: "2018-10-17T09:33:46Z"
        updated_at: "2018-10-17T09:33:46Z"
    ProjectExpenses:
      type: object
      description: "The representation contains, among the standard fields, also the following fields:\n\n- Custom properties\n- Company\n- Project\n- Group\n\n```json\n{\n  \"id\": 47266,\n  \"date\": \"2024-06-07\",\n  \"title\": \"Hosting XS\",\n  \"description\": \"<div>Hosting, Monitoring und Backup</div>\",\n  \"quantity\": 3,\n  \"unit\": \"Monat\",\n  \"unit_price\": 29,\n  \"unit_cost\": 19,\n  \"price\": 87,\n  \"cost\": 57,\n  \"currency\": \"CHF\",\n  \"budget_relevant\": true,\n  \"billable\": true,\n  \"billed\": false,\n  \"purchase_assignment_locked\": true,\n  \"cost_total_planned\": 0,\n  \"planned_purchase_date\": null,\n  \"invoice_id\": null,\n  \"recurring_expense_id\": null,\n  \"service_period\": \"06/2024\",\n  \"service_period_from\": \"2024-06-01\",\n  \"service_period_to\": \"2024-06-30\",\n  \"file_url\": \"https//meinefirma.mocoapp.com/.../beleg1.jpg\",\n  \"revenue_category\": {\n    \"id\": 124,\n    \"name\": \"Hosting\",\n    \"revenue_account\": 30056,\n    \"cost_category\": \"HO1\"\n  },\n  \"custom_properties\": {\n    \"Type\": \"Website\"\n  },\n  \"company\": {\n    \"id\": 1234,\n    \"name\": \"Acme Corp.\"\n  },\n  \"project\": {\n    \"id\": 1234,\n    \"name\": \"Project A\"\n  },\n  \"group\": {\n    \"id\": 456,\n    \"title\": \"Exepnse Group A\",\n    \"budget\": 5200\n  },\n  \"purchase_items\": [\n    {\n      \"id\": 1234,\n      \"title\": \"Item Title\",\n      \"net_total\", 12.0,\n      \"currency\": \"EUR\",\n      \"purchase_id\": 345,\n      \"document\": {\n        \"id\": 567,\n        \"file_url\": \"https://...\"\n      }\n    }\n  ],\n  \"created_at\": \"2024-06-06T09:33:46Z\",\n  \"updated_at\": \"2024-06-06T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
    ProjectGroup:
      type: object
      description: "The project group representation contains, among the standard fields, also:\n\n- projects\n- company\n- user\n\n```json\n{\n  \"id\": 234,\n  \"name\": \"Project Group Name\",\n  \"user\": {\n    \"id\": 933613686,\n    \"firstname\": \"Jane\",\n    \"lastname\": \"Doe\"\n  },\n  \"company\": {\n    \"id\": 760553185,\n    \"name\": \"Acme Inc.\"\n  },\n  \"budget\": 42000.0,\n  \"currency\": \"EUR\",\n  \"info\": \"An info text\",\n  \"custom_properties\": {},\n  \"customer_report_url\": \"https://mycompany.mocoapp.com/project_groups/961779869/customer_report/1142853e926ee7c4dd7e\",\n  \"projects\": [\n    {\n      \"id\": 944958556,\n      \"identifier\": \"P1234\",\n      \"name\": \"Project Name\",\n      \"active\": true,\n      \"budget\": 10000.0\n    }\n  ],\n  \"created_at\": \"2024-08-16T08:36:44Z\",\n  \"updated_at\": \"2024-08-16T08:36:44Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
