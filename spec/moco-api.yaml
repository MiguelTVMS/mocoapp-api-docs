  /receipts:
    get:
      summary: GET /receipts
      description: "Retrieve all receipts:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/receipts' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's also possible to filter:\n\n- [Global filters apply](../entities#global-filters)\n- **from** \u2013 \"2021-06-01\"\n- **to** \u2013 \"2021-06-30\"\n- **project_id** \u2013 567 (Project ID)\n- **user_id** \u2013 933 (User ID)\n- **purchase_category_id** \u2013 2684 (Purchase Category ID)\n- **refund_request_id** \u2013 123,456 (Refund Request IDs)\n- **submitted** \u2013 true/false (refund request created)\n\nReturns an array with all receipt information (see attributes)."
      tags:
        - Receipts
      security:
        -
          TokenAuth:
            []
      parameters:
        -
          $ref: "#/components/parameters/Ids"
        -
          $ref: "#/components/parameters/UpdatedAfter"
        -
          $ref: "#/components/parameters/CustomProperties"
        -
          $ref: "#/components/parameters/Page"
        -
          $ref: "#/components/parameters/PerPage"
        -
          $ref: "#/components/parameters/SortBy"
      responses:
        200:
          description: "Retrieve all receipts:\n\n```bash\ncurl -X GET \\\n  'https://{domain}.mocoapp.com/api/v1/receipts' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nIt's also possible to filter:\n\n- [Global filters apply](../entities#global-filters)\n- **from** \u2013 \"2021-06-01\"\n- **to** \u2013 \"2021-06-30\"\n- **project_id** \u2013 567 (Project ID)\n- **user_id** \u2013 933 (User ID)\n- **purchase_category_id** \u2013 2684 (Purchase Category ID)\n- **refund_request_id** \u2013 123,456 (Refund Request IDs)\n- **submitted** \u2013 true/false (refund request created)\n\nReturns an array with all receipt information (see attributes)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipts"
              examples:
                example:
                  value:
                    -
                      id: 123
                      title: "Team-Lunch"
                      date: "2021-12-13"
                      billable: false
                      pending: false
                      gross_total: 56.5
                      currency: CHF
                      items:
                        -
                          gross_total: 56.5
                          vat:
                            id: 186
                            tax: 7.7
                            reverse_charge: false
                            intra_eu: false
                          purchase_category:
                            id: 2684
                            name: Bewirtungsaufwände
                      project:
                        id: 567
                        name: Intern/Admin
                        billable: false
                        company:
                          id: 789
                          name: Acme Inc.
                      refund_request:
                        id: 266
                        status: paid
                      info: "Teamlunch mit Peter, Sandra und Till"
                      user:
                        id: 933
                        firstname: Sabine
                        lastname: Schäuble
                      attachment_url: /system/documents/account/123/document/123/d8fef77df35c5753.pdf
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      operationId: getReceiptsReceipts
    post:
      summary: POST /receipts
      description: "Create a receipt:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/receipts' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '\n    {\n      \"date\": \"2020-02-02\",\n      \"title\": \"Lunch with coworkers\",\n      \"currency\": \"CHF\",\n      \"items\": [\n        {\n          \"vat_code_id\": 186,\n          \"gross_total\": 99.90\n        }\n      ],\n      \"project_id\": 123,\n      \"attachment\": {\n        \"filename\": \"document.pdf\",\n        \"base64\": \"JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...\"\n      }\n    }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2020-02-02\"\n- **title\\*** \u2013 \"Lunch with coworkers\"\n- **currency\\*** - \"CHF\"\n- **items\\*** \u2013 list of positions. At least one position must be present and every position has the following fields:\n  - **vat_code_id\\*** \u2013 186 (Vat Code ID)\n  - **gross_total\\*** \u2013 99.90\n  - **purchase_category_id** \u2013 123 (Purchase Category ID, currently has to be **the same** for all items)\n- **project_id** \u2013 123 (Project ID)\n- **info** \u2013 free text\n- **billable** \u2013 true/false\n- **attachment** \u2013 file attached to the purchase, with the following fields:\n  - **filename** \u2013 \"document.pdf\"\n  - **base64** \u2013 base64 encoded content of the file"
      tags:
        - Receipts
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "Create a receipt:\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/receipts' \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '\n    {\n      \"date\": \"2020-02-02\",\n      \"title\": \"Lunch with coworkers\",\n      \"currency\": \"CHF\",\n      \"items\": [\n        {\n          \"vat_code_id\": 186,\n          \"gross_total\": 99.90\n        }\n      ],\n      \"project_id\": 123,\n      \"attachment\": {\n        \"filename\": \"document.pdf\",\n        \"base64\": \"JVBERi0xLjQKJeLjz9MKNCAwIG9iago8PC9GaWx...\"\n      }\n    }'\n```\n\nMandatory fields are marked with a star (\\*):\n\n- **date\\*** \u2013 \"2020-02-02\"\n- **title\\*** \u2013 \"Lunch with coworkers\"\n- **currency\\*** - \"CHF\"\n- **items\\*** \u2013 list of positions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipts"
              examples:
                example:
                  value:
                    id: 123
                    title: "Team-Lunch"
                    date: "2021-12-13"
                    billable: false
                    pending: false
                    gross_total: 56.5
