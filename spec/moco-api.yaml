    Activities:
      type: object
      description: "Activities contain among the standard fields also:\n\n- Project\n- Customer\n- Task (on the project)\n- User (creator)\n\nThe attribute `seconds` are the billable seconds of the activity; the attribute `worked_seconds` are the seconds considered for the users' actual hours.\n\nAttributes `remote_service`, `remote_id` und `remote_url` are set by the MOCO Browser extension and represent a ticket in an external system (Trello, Jira, etc.) that this activity's time was spent on.\n`timer_started_at` is `null` for all activities and shows a timestamp if the timer is running on an activity. A timer can only be running on one activity at a time per user.\n\n```json\n{\n  \"id\": 982237015,\n  \"date\": \"2018-07-03\",\n  \"hours\": 1.25,\n  \"seconds\": 4500,\n  \"worked_seconds\": 4500,\n  \"description\": \"Analysis context and dependencies\",\n  \"billed\": false,\n  \"invoice_id\": null,\n  \"billable\": false,\n  \"tag\": \"\",\n  \"remote_service\": \"trello\",\n  \"remote_id\": \"9qzOS8AA\",\n  \"remote_url\": \"https://trello.com/c/9qzOS8AA/123-analyse\",\n  \"project\": {\n    \"id\": 944587499,\n    \"name\": \"Website Relaunch\",\n    \"billable\": false\n  },\n  \"task\": {\n    \"id\": 658636,\n    \"name\": \"Concept\",\n    \"billable\": false\n  },\n  \"customer\": {\n    \"id\": 760253684,\n    \"name\": \"Example Inc.\"\n  },\n  \"user\": {\n    \"id\": 933590696,\n    \"firstname\": \"John\",\n    \"lastname\": \"Doe\"\n  },\n  \"hourly_rate\": 150,\n  \"timer_started_at\": null,\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\"\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
      example:
        id: 982237015
        date: "2018-07-03"
        hours: 1.25
        seconds: 4500
        worked_seconds: 4500
        description: Analysis context and dependencies
        billed: false
        invoice_id: null
        billable: false
        tag: ""
        remote_service: trello
        remote_id: 9qzOS8AA
        remote_url: "https://trello.com/c/9qzOS8AA/123-analyse"
        project:
          id: 944587499
          name: Website Relaunch
          billable: false
        task:
          id: 658636
          name: Concept
          billable: false
        customer:
          id: 760253684
          name: Example Inc.
        user:
          id: 933590696
          firstname: John
          lastname: Doe
        hourly_rate: 150
        timer_started_at: null
        created_at: "2018-10-17T09:33:46Z"
        updated_at: "2018-10-17T09:33:46Z"
    Comments:
      type: object
      description: "The representation contains, among the standard fields, also:\n\n- user (creator)\n\n```json\n{\n  \"id\": 123,\n  \"commentable_id\": 12345,\n  \"commentable_type\": \"Project\",\n  \"text\": \"<div>Project was ordered on <strong>1.10.2017</strong></div>.\",\n  \"manual\": true,\n  \"user\": {\n    \"id\": 567,\n    \"firstname\": \"Tobias\",\n    \"lastname\": \"Miesel\"\n  },\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\"\n}\n```\n\nThe text must be \"plain text\" or valid HTML. MOCO removes all HTML-tags, except for `['div', 'strong', 'em', 'u', 'pre', 'ul', 'ol', 'li', 'br']`.\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
      example:
        id: 123
        commentable_id: 12345
        commentable_type: Project
        text: <div>Project was ordered on <strong>1.10.2017</strong></div>.
        manual: true
        user:
          id: 567
          firstname: Tobias
          lastname: Miesel
        created_at: "2018-10-17T09:33:46Z"
        updated_at: "2018-10-17T09:33:46Z"
    Companies:
      type: object
      description: "The company representation contains among default fields the following features:\n\n- Type (\"customer\", \"supplier\", \"organization\")\n- Tags\n- Custom properties\n- Projects (shortened)\n- User (shortened)\n- billing_vat (\"tax\", \"reverse_charge\", \"intra_eu\" (intra community trade, only applicable for accounts in the EU))\n\n```json\n{\n  \"id\": 760253573,\n  \"type\": \"customer\",\n  \"name\": \"Beispiel AG\",\n  \"website\": \"www.beispiel-ag.com\",\n  \"email\": \"info@beispiel-ag.com\",\n  \"billing_email_cc\": \"cc@beispiel-ag.com\",\n  \"phone\": \"+49 30 123 45 67\",\n  \"fax\": \"+49 30 123 45 66\",\n  \"address\": \"Beispiel AG\\nBeispielstrasse 123\\n12345 Beispielstadt\",\n  \"tags\": [\"Netzwerk\", \"Druckerei\"],\n  \"user\": {\n    \"id\": 933589840,\n    \"firstname\": \"Tobias\",\n    \"lastname\": \"Miesel\"\n  },\n  \"info\": \"\",\n  \"custom_properties\": {\n    \"UID\": \"1234-UID-4567\"\n  },\n  \"identifier\": \"36\",\n  \"intern\": false,\n  \"billing_tax\": 0,\n  \"customer_vat\": { \"tax\": 0.0, \"reverse_charge\": true, \"intra_eu\": true, \"active\": true, \"print_gross_total\": true, \"notice_tax_exemption\": \"\", \"notice_tax_exemption_alt\": \"\" }, // for customers only\n  \"supplier_vat\": { \"tax\": 0.0, \"reverse_charge\": true, \"intra_eu\": true, \"active\": true }, // for suppliers only\n  \"currency\": \"CHF\",\n  \"custom_rates\": false,\n  \"include_time_report\": false,\n  \"billing_notes\": \"Vor Rechnungsstellung PO beantragen.\",\n  \"default_discount\": 0.0,\n  \"default_cash_discount\": 2.0,\n  \"default_cash_discount_days\": 10,\n  \"country_code\": \"CH\",\n  \"vat_identifier\": \"CH999999999\",\n  \"alternative_correspondence_language\": false,\n  \"default_invoice_due_days\": 30,\n  \"footer\": \"<div>Footer text</div>\",\n  \"projects\": [\n    {\n      \"id\": 944504145,\n      \"identifier\": \"46\",\n      \"name\": \"Layoutanpassung\",\n      \"active\": false,\n      \"billable\": true\n    }\n  ],\n  \"created_at\": \"2018-10-17T09:33:46Z\",\n  \"updated_at\": \"2018-10-17T09:33:46Z\",\n  \"debit_number\": 10000\n}\n```\n\nCustom fields reference:\nMOCO supports saving custom fields to many of its resources. These custom fields are readable and writable via the `custom_properties` field.\n\n Custom fields must first be defined in the MOCO settings.\n\n The size of the custom_properties field is limitted to 12 kB.\n\n```json\n\"custom_properties\": {\n    \"UID\": \"123-UID-456\",\n    \"Line of business\": \"Automotive\"\n}\n```\n\nParameters are sent with their name as key:\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"name\": \"Beispiel AG\",\n    \"currency\": \"CHF\",\n    \"custom_properties\": {\n      \"Line of business\": \"Automotive\"\n    }\n  }'\n```\n\nAll values are encoded as strings, expect for Multiple Choice, which is encoded as an array.\n\n```bash\ncurl -X POST \\\n  https://{domain}.mocoapp.com/api/v1/customers \\\n  -H 'Authorization: Token token=YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n        \"custom_properties\": {\n          \"Line of business\": [\"Automotive\", \"Banking\"]\n        }\n      }'\n```\n\n- Single-line input \u2013 \"Automotive\"\n- Mehrzeilige Eingabe \u2013 \"A multiline input...\"\n- Link \u2013 \"https://www...\"\n- Date \u2013 \"2021-12-31\"\n- Yes/No \u2013 \"0\", \"1\" (0 = No, 1 = Yes)\n- Single choice \u2013 \"Value\"\n- Multiple choice \u2013 [\"Value 1\", \"Value 2\"]\n\n\nThe provided custom properties are merged with the existing custom properties of the entity. That is, only the provided custom properties are updated and the other custom properties of the entity are left unchanged.\nIt is possible to filter entities by custom fields, as described in\n[Global filters](./entities#filter-by-custom-fields-\u2013-custom_properties)"
