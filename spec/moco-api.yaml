  /users/presences/touch:
    post:
      summary: POST /users/presences/touch
      description: "This request creates a new presence and returns it for the user with the corresponding API-Key starting from the current time or terminates an existing open presence at the current time. Can be used to implement a time clock system (e.g. RFID).\n\n```bash\ncurl -X POST \\\n  'https://{domain}.mocoapp.com/api/v1/users/presences/touch' \\\n  -H 'Authorization: Token token=YOUR_API_KEY'\n```\n\nA first request at 9:30 AM creates a presence with `from=\"09:30\"`, a second request at 11:30 AM sets `to=\"11:30\"` of the previous presence.\n\n> There are two special situations to take into consideration:\n>\n> 1. If a presence is started and stopped by `touch` within the same minute, then it is discarded.\n> 2. If a `touch` conflicts with an existing presence, then the request is refused and the server response code\n   is `423 Locked`.\n\n```bash\ncurl -X POST \\\n 'https://{domain}.mocoapp.com/api/v1/users/presences/touch' \\\n -H 'Authorization: Token token=YOUR_API_KEY' \\\n -H 'Content-Type: application/json' \\\n -d '{\n       \"is_home_office\": true,\n     }'\n```\n\nOptional fields:\n\n- **is_home_office** \u2013 true/false (default: `false`, will set the whole day)\n- **override** \u2013 \"2022-03-27 14:45\"\n\nTo prevent time differences during delays between systems, the parameter `override` can be passed with the time of the event in the format `YYYY-MM-DD HH:MM`. It has to be in 24h format and is timezone agnostic which means that MOCO stores the hour and minute in local time."
      tags:
        - User Presences
      security:
        -
          TokenAuth:
            []
      responses:
        201:
          description: "This request creates a new presence and returns it for the user with the corresponding API-Key starting from the current time or terminates an existing open presence at the current time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPresences"
              examples:
                example:
                  value:
                    is_home_office: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPresences"
            examples:
              example:
                value:
                  is_home_office: true
      operationId: postUsersPresencesTouchUserPresences
